name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:booking
      - run: npm run test:pricing
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_SHARE_ORIGIN: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || steps.pages.outputs.base_path || '/' }}
          PUBLIC_BOOKING_API_URL: ${{ vars.PUBLIC_BOOKING_API_URL }}
          PUBLIC_ROUTE_API_URL: ${{ vars.PUBLIC_ROUTE_API_URL }}
          PUBLIC_ROUTE_DEMO: ${{ vars.PUBLIC_ROUTE_DEMO || 'false' }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
      - run: npm run audit:seo
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
